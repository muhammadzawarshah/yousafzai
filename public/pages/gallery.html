<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <my-title></my-title>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <!-- GLightbox CSS (For Photo & Video Popups) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css">
    <!-- Custom Styles -->
    <link rel="stylesheet" href="/css/styles.css">
    
    <style>
        /* Remove display: none, allowing class toggling to work properly */
    </style>
</head>
<body class="text-gray-600">

    <!-- Content Wrapper -->
    <div>
        <my-header></my-header>  <!-- Header Component -->
        <my-nav></my-nav>  <!-- Navbar Component -->

        <main class="main-element">

            <!-- buttons -->
             <div class="text-center button-container">
                <button class="btn-gallery btn-gallery-active" data-name="photos">Photos</button>
                <button class="btn-gallery" data-name="videos">Videos</button>
             </div>
            <!-- photo gallery container -->
                <div id="photo-gallery" class="card my-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
                    
                </div>
            <!-- photo lightbox div -->
             <div id="photo-lightbox" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
                <img id="photo-lightbox-img" class="max-w-3xl max-h-full rounded-lg shadow-lg">
             </div>

             <!-- video gallery container -->
             <div id="video-gallery" class="card my-4 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5 hidden">
                    
             </div>

             <!-- video lightbox div -->
             <div id="video-lightbox" class="fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center hidden z-50">
                <video id="video-lightbox-vid" autoplay controls class="max-w-3xl max-h-full rounded-lg shadow-lg">
                    <source id="video-lightbox-src">
                </video>
             </div>
        </main>

        <my-footer></my-footer>  <!-- Footer Component -->
    </div>

    <!-- Include Components Script -->
    <script src="/components.js" defer></script>

    
    <!-- Icons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="/js/gallery.js"></script>
</body>
</html>
